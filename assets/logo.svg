<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" aria-label="Prime Fit Studio logo">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e6c878"/>
      <stop offset="50%" stop-color="#c9a14a"/>
      <stop offset="100%" stop-color="#8a6a25"/>
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2f2f2"/>
      <stop offset="50%" stop-color="#c8c8cc"/>
      <stop offset="100%" stop-color="#7a7a80"/>
    </linearGradient>
  </defs>
  <!-- Outer gold pentagon -->
  <polygon points="100,8 192,72 158,184 42,184 8,72"
           fill="url(#goldGrad)" stroke="#5a4517" stroke-width="1.5"/>
  <!-- Inner black pentagon -->
  <polygon points="100,22 178,76 150,172 50,172 22,76"
           fill="#0a0a0a"/>
  <!-- PFS lettering -->
  <g fill="url(#silverGrad)" stroke="#5a5a5a" stroke-width="0.8" font-family="Oswald, Arial Black, sans-serif" font-weight="700">
    <text x="100" y="128" text-anchor="middle" font-size="78" letter-spacing="-2">PFS</text>
  </g>
</svg>
